version: 2
models:
  - name: stg_parte
    description: "El parte diario limpio, con las dos entregas"
    columns:
      - name: lote
        data_tests: [unique, not_null]
      - name: cervecero
        data_tests: [not_null]
      - name: estilo
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["IPA", "Lager", "Stout", "Pale Ale", "Sour", "Pilsner", "Hazy IPA", "Radler"]
